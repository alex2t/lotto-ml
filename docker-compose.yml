# The containers run as UID:GID (default 1000:1000) and the host's ./data is bind-mounted over the
# image's own directory, so the host directory must be writable by that user. On the VPS either set
# UID/GID in a .env file to the owner of ./data, or run `chown -R 1000:1000 data` once (F-45).
services:
  data-engine:
    build:
      context: .
      dockerfile: Dockerfile.data_engine
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: lotto-data-engine:latest
    container_name: lotto-data-engine
    restart: "no"
    volumes:
      - ./data:/app/data:rw
    environment:
      - PYTHONUNBUFFERED=1

  nextjs-web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: lotto-nextjs:latest
    container_name: lotto-nextjs
    restart: unless-stopped
    # A bare `docker compose up` must not serve a half-written artifact. The start scripts
    # run the engine themselves and then pass --no-deps.
    depends_on:
      data-engine:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data:ro
    # The admin account comes from secrets.env, not .env: compose reads .env for its own
    # variable substitution, and a bcrypt hash is full of `$$` signs that it would try to
    # expand there - the hash arrived mangled and every login failed (F-58). `format: raw`
    # passes the file through literally, and `required: false` keeps the public site
    # starting without an admin account, because one account's failure must never take the
    # site down.
    env_file:
      - path: secrets.env
        required: false
        format: raw
    environment:
      - DATA_DIR=/app/data
